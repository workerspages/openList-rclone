[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx-stdout.log
stderr_logfile=/var/log/nginx/error.log
priority=10

[program:openlist]
command=/app/openlist server --data /data/openlist
environment=PORT="5244"
autostart=true
autorestart=true
stdout_logfile=/var/log/openlist.log
stderr_logfile=/var/log/openlist.log
priority=20

[program:rclone]
command=/usr/bin/rclone rcd --rc-addr=127.0.0.1:5572 --rc-no-auth --rc-serve --config=/data/rclone/rclone.conf --cache-dir=/data/rclone/cache
autostart=true
autorestart=true
stdout_logfile=/var/log/rclone.log
stderr_logfile=/var/log/rclone.log
priority=30

[program:api]
command=node /app/server/index.js
autostart=true
autorestart=true
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
environment=NODE_ENV="production"
priority=40

[program:autosync]
command=/bin/bash -c 'if [ -z "$SYNC_DEST" ]; then sleep infinity; fi; INTERVAL_MIN=$(echo "${SYNC_INTERVAL:-5}" | tr -dc "0-9"); [ -z "$INTERVAL_MIN" ] && INTERVAL_MIN=5; if [ "$INTERVAL_MIN" -eq 0 ]; then echo "[AutoSync] Read-Only Mode enabled (SYNC_INTERVAL=0). Background sync and shutdown push are completely disabled."; sleep infinity; fi; INTERVAL_SEC=$((INTERVAL_MIN * 60)); MASKED_DEST=$(echo "$SYNC_DEST" | sed -E -e "s/(:\/\/[^:]+:)[^@]+@/\1***@/g" -e "s/(secret_access_key|access_key_id|password|pass|token|client_secret)=([^,:]+)/\1=\"***\"/g"); echo "[AutoSync] 每 ${INTERVAL_MIN} 分钟自动同步至 $MASKED_DEST"; sync_data() { echo "[AutoSync] === 同步开始于 $(date +"%%Y-%%m-%%d %%H:%%M:%%S") ==="; START=$(date +%%s); echo "[AutoSync] 正在执行 SQLite WAL checkpoint..."; sqlite3 /data/openlist/data.db "PRAGMA wal_checkpoint(TRUNCATE);" 2>/dev/null || echo "[AutoSync] WAL checkpoint 跳过(数据库可能不存在)"; /usr/bin/rclone sync /data "$SYNC_DEST" --checksum --exclude "rclone/cache/**" --exclude "openlist/temp/**" --exclude "openlist/data/temp/**" --exclude "openlist/log/**" --exclude "openlist/data/log/**" --exclude "openlist/data/bleve/**" --exclude "*.db-wal" --exclude "*.db-shm" -v; END=$(date +%%s); echo "[AutoSync] === 同步完成于 $(date +"%%Y-%%m-%%d %%H:%%M:%%S") (耗时: $((END - START))秒) ==="; }; trap "echo \"[AutoSync] 收到关机指令，等待进程安全退出以保护数据库...\"; sleep 2; sync_data; exit 0" SIGTERM SIGINT; while true; do sleep $INTERVAL_SEC & wait $!; sync_data; done'
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50
